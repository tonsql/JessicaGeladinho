<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08080a">
  <meta name="description" content="Jessica Gourmet — geladinhos gourmet, encomendas e rastreio de pedidos.">
  <title>Jessica Gourmet</title>
  <style>:root {
  color-scheme: dark;
  --bg: #08080a;
  --panel: #111114;
  --panel-2: #17171b;
  --white: #fff;
  --muted: #aaaab3;
  --muted-2: #73737d;
  --pink: #ff4f9a;
  --pink-strong: #ff2f83;
  --pink-soft: rgba(255,79,154,.12);
  --border: rgba(255,255,255,.09);
  --shadow: 0 24px 70px rgba(0,0,0,.32);
  font-family: Inter, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--white);
  font-synthesis: none;
  text-rendering: optimizeLegibility;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--bg); }
body { margin: 0; min-width: 320px; background: radial-gradient(circle at 75% 10%, rgba(255,79,154,.08), transparent 30%), var(--bg); color: var(--white); overflow-x: hidden; }
button, input, textarea, select { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
a { color: inherit; text-decoration: none; }
button { color: inherit; }
img { max-width: 100%; display: block; }

.site-app { min-height: 100vh; position: relative; isolation: isolate; overflow: hidden; }
.ambient { position: fixed; z-index: -2; width: 380px; height: 380px; border-radius: 999px; filter: blur(100px); pointer-events: none; opacity: .12; }
.ambient-one { top: 8%; right: -120px; background: var(--pink); }
.ambient-two { bottom: 18%; left: -180px; background: #fff; opacity: .035; }

.site-header { width: min(1240px, calc(100% - 36px)); min-height: 82px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 24px; border-bottom: 1px solid var(--border); position: relative; z-index: 50; }
.brand { display: inline-flex; align-items: center; gap: 11px; justify-self: start; }
.brand img { width: 46px; height: 46px; object-fit: cover; border-radius: 50%; border: 1px solid rgba(255,255,255,.13); box-shadow: 0 0 0 4px rgba(255,79,154,.06); }
.brand span { display: flex; flex-direction: column; gap: 2px; }
.brand strong { font-size: 14px; letter-spacing: -.02em; }
.brand small { font-size: 9px; color: var(--muted-2); text-transform: uppercase; letter-spacing: .12em; }
.desktop-nav { display: inline-flex; align-items: center; gap: 5px; justify-self: center; border: 1px solid var(--border); background: rgba(255,255,255,.025); padding: 4px; border-radius: 14px; }
.desktop-nav a { min-width: 88px; text-align: center; padding: 9px 14px; border-radius: 10px; color: var(--muted); font-size: 11px; font-weight: 700; transition: .25s ease; }
.desktop-nav a:hover, .desktop-nav a.active { color: white; background: rgba(255,255,255,.06); }
.desktop-nav a.active { box-shadow: inset 0 0 0 1px rgba(255,79,154,.15); }
.cart-button { justify-self: end; min-height: 42px; border: 1px solid var(--border); border-radius: 13px; background: rgba(255,255,255,.035); padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 11px; font-weight: 800; transition: .25s ease; }
.cart-button:hover { border-color: rgba(255,79,154,.35); background: var(--pink-soft); transform: translateY(-1px); }
.cart-button b { min-width: 20px; height: 20px; border-radius: 99px; display: grid; place-items: center; background: var(--pink); font-size: 9px; }

.mobile-nav { display: none; }
.page { width: min(1240px, calc(100% - 36px)); margin: 0 auto; position: relative; z-index: 2; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--pink); font-size: 9px; letter-spacing: .17em; font-weight: 900; }
.eyebrow::before { content: ''; width: 18px; height: 1px; background: var(--pink); }

.hero-section { min-height: 535px; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 50px; padding: 58px 0 36px; }
.hero-copy { max-width: 680px; }
.hero-copy h1 { font-size: clamp(49px, 6.1vw, 84px); line-height: .96; letter-spacing: -.066em; margin: 18px 0 22px; font-weight: 850; }
.hero-copy h1 em { font-family: Georgia, "Times New Roman", serif; color: var(--pink); font-weight: 500; letter-spacing: -.055em; }
.hero-copy p { max-width: 590px; color: var(--muted); font-size: 15px; line-height: 1.75; margin: 0 0 28px; }
.hero-cta { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; padding: 0 22px; border-radius: 14px; background: var(--pink); font-size: 11px; font-weight: 900; box-shadow: 0 14px 35px rgba(255,79,154,.18); transition: .25s ease; 
  border: 0;
  color: inherit;
  cursor: pointer;
  font-family: inherit;}
.hero-cta:hover { transform: translateY(-2px); background: var(--pink-strong); box-shadow: 0 18px 45px rgba(255,79,154,.25); }
.hero-visual { position: relative; min-height: 430px; display: grid; place-items: center; }
.hero-visual::before { content: ''; position: absolute; width: 76%; aspect-ratio: 1; border-radius: 50%; border: 1px solid rgba(255,255,255,.08); box-shadow: inset 0 0 80px rgba(255,79,154,.06); }
.hero-glow { position: absolute; width: 55%; aspect-ratio: 1; border-radius: 50%; background: var(--pink); filter: blur(80px); opacity: .16; }
.hero-visual img { width: min(420px, 84%); aspect-ratio: 1; border-radius: 50%; object-fit: cover; position: relative; z-index: 2; box-shadow: 0 35px 80px rgba(0,0,0,.42), 0 0 0 8px rgba(255,255,255,.025); animation: heroFloat 5.5s ease-in-out infinite; }
.hero-price { position: absolute; z-index: 4; right: 1%; bottom: 17%; min-width: 122px; padding: 13px 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,.12); background: rgba(13,13,16,.84); backdrop-filter: blur(18px); box-shadow: var(--shadow); transform: rotate(-2deg); }
.hero-price small { display: block; color: var(--muted); text-transform: uppercase; font-size: 8px; letter-spacing: .12em; margin-bottom: 4px; }
.hero-price strong { color: var(--pink); font-size: 19px; }

.catalog-section { padding: 48px 0 92px; scroll-margin-top: 20px; }
.section-heading { display: flex; align-items: end; justify-content: space-between; gap: 30px; margin-bottom: 28px; }
.section-heading h2 { font-size: clamp(34px, 4vw, 52px); letter-spacing: -.055em; line-height: 1; margin: 10px 0 0; }
.section-heading p { color: var(--muted-2); margin: 0; font-size: 11px; }
.product-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.product-card { border: 1px solid var(--border); background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,.018)); border-radius: 24px; overflow: hidden; box-shadow: 0 16px 50px rgba(0,0,0,.12); transition: transform .3s ease, border-color .3s ease, box-shadow .3s ease; }
.product-card:hover { transform: translateY(-5px); border-color: rgba(255,79,154,.25); box-shadow: 0 22px 55px rgba(0,0,0,.25); }
.product-card.sold-out { opacity: .72; }
.product-media { height: 290px; position: relative; overflow: hidden; background: radial-gradient(circle at 50% 35%, rgba(255,255,255,.07), transparent 58%), #0d0d10; }
.product-photo { width: 100%; height: 100%; object-fit: cover; transition: transform .5s ease; }
.product-card:hover .product-photo { transform: scale(1.035); }
.product-placeholder { width: 100%; height: 100%; display: grid; place-items: center; align-content: center; gap: 15px; position: relative; overflow: hidden; }
.product-placeholder::before { content: ''; position: absolute; width: 180px; height: 180px; border-radius: 50%; background: var(--accent); filter: blur(75px); opacity: .18; }
.product-placeholder small { z-index: 2; color: #6d6d74; font-size: 8px; letter-spacing: .13em; text-transform: uppercase; }
.geladinho-illustration { width: 92px; height: 190px; position: relative; z-index: 2; transform: rotate(5deg); filter: drop-shadow(0 25px 20px rgba(0,0,0,.3)); }
.geladinho-illustration .bag { position: absolute; inset: 20px 4px 0; border-radius: 12px 12px 27px 27px; background: linear-gradient(120deg, rgba(255,255,255,.36), transparent 28%), var(--accent); border: 2px solid rgba(255,255,255,.32); opacity: .9; }
.geladinho-illustration .tie { position: absolute; z-index: 3; top: 4px; left: 29px; width: 36px; height: 25px; background: rgba(255,255,255,.7); clip-path: polygon(50% 0, 65% 43%, 100% 55%, 68% 66%, 60% 100%, 46% 72%, 9% 89%, 31% 56%, 0 38%, 38% 40%); }
.geladinho-illustration .shine { position: absolute; z-index: 4; top: 48px; left: 22px; width: 13px; height: 80px; border-radius: 50%; background: rgba(255,255,255,.2); transform: rotate(6deg); }
.stock-badge { position: absolute; top: 13px; left: 13px; z-index: 4; border-radius: 999px; background: rgba(8,8,10,.78); border: 1px solid rgba(255,255,255,.12); backdrop-filter: blur(12px); padding: 7px 10px; font-size: 8px; font-weight: 850; letter-spacing: .04em; }
.stock-badge.empty { color: #bebec5; }
.product-info { padding: 17px; }
.product-info > div { display: flex; align-items: start; justify-content: space-between; gap: 10px; }
.product-info h3 { margin: 0; font-size: 14px; letter-spacing: -.02em; }
.product-info strong { color: var(--pink); font-size: 14px; white-space: nowrap; }
.product-info button { width: 100%; min-height: 42px; margin-top: 15px; border: 1px solid var(--border); background: rgba(255,255,255,.03); border-radius: 12px; display: flex; justify-content: center; align-items: center; gap: 7px; cursor: pointer; font-size: 10px; font-weight: 850; transition: .25s ease; }
.product-info button:hover:not(:disabled) { background: var(--pink); border-color: var(--pink); transform: translateY(-1px); }
.product-info button:disabled { opacity: .45; cursor: not-allowed; }
.loading-grid .product-skeleton { height: 380px; border-radius: 24px; border: 1px solid var(--border); background: linear-gradient(100deg, #111114 25%, #18181c 38%, #111114 52%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
.empty-state { border: 1px dashed var(--border); border-radius: 20px; min-height: 170px; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; text-align: center; color: var(--muted); }
.empty-state strong { color: white; }

.inner-page { min-height: calc(100vh - 160px); padding: 72px 0 90px; display: grid; align-items: center; }
.tracking-card { width: min(760px, 100%); margin: 0 auto; border: 1px solid var(--border); background: rgba(255,255,255,.025); border-radius: 28px; padding: clamp(24px, 5vw, 48px); box-shadow: var(--shadow); }
.inner-heading h1, .contact-copy h1 { font-size: clamp(40px, 5.3vw, 66px); line-height: .98; letter-spacing: -.06em; margin: 14px 0; }
.inner-heading p, .contact-copy > p { color: var(--muted); line-height: 1.7; font-size: 13px; }
.tracking-form { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin-top: 28px; }
.tracking-form input, .tracking-form button { min-height: 50px; border-radius: 14px; }
.tracking-form input { min-width: 0; outline: 0; border: 1px solid var(--border); background: #0c0c0f; color: white; padding: 0 16px; text-transform: uppercase; transition: .2s ease; }
.tracking-form input:focus { border-color: rgba(255,79,154,.52); box-shadow: 0 0 0 4px rgba(255,79,154,.08); }
.tracking-form button { border: 0; background: var(--pink); color: white; padding: 0 22px; font-size: 10px; font-weight: 850; cursor: pointer; }
.tracking-form button:disabled { opacity: .6; }
.tracking-message { margin-top: 13px; border: 1px solid var(--border); background: rgba(255,255,255,.025); border-radius: 13px; padding: 13px 15px; color: var(--muted); font-size: 11px; }
.tracking-result { margin-top: 18px; padding-top: 20px; border-top: 1px solid var(--border); animation: popIn .35s ease both; }
.tracking-result-top { display: flex; align-items: flex-start; gap: 14px; }
.status-icon { width: 46px; height: 46px; flex: none; display: grid; place-items: center; border-radius: 14px; background: var(--pink-soft); color: var(--pink); }
.tracking-result-top small { color: var(--pink); font-size: 9px; letter-spacing: .1em; }
.tracking-result-top h2 { margin: 4px 0 5px; font-size: 22px; letter-spacing: -.035em; }
.tracking-result-top p { margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
.status-progress { margin-top: 27px; display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
.status-line { position: absolute; left: 12.5%; right: 12.5%; top: 13px; height: 2px; background: #242429; overflow: hidden; }
.status-line span { display: block; height: 100%; width: var(--progress); background: var(--pink); transition: width .4s ease; }
.status-step { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 7px; color: #6f6f77; font-size: 8px; text-align: center; }
.status-step i { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; border: 1px solid #2b2b31; background: #101013; font-style: normal; font-size: 9px; }
.status-step.done { color: white; }
.status-step.done i { background: var(--pink); border-color: var(--pink); }
.order-summary { margin-top: 22px; padding: 14px; border-radius: 14px; background: rgba(255,255,255,.025); border: 1px solid var(--border); }
.order-summary small { color: var(--muted-2); font-size: 8px; letter-spacing: .13em; }
.order-summary p { margin: 7px 0 0; font-size: 11px; line-height: 1.6; }

.contact-hero { display: grid; grid-template-columns: 1.15fr .85fr; gap: 30px; align-items: stretch; }
.contact-copy, .contact-info-card { border: 1px solid var(--border); border-radius: 28px; background: rgba(255,255,255,.025); padding: clamp(25px, 5vw, 48px); }
.contact-copy ul { list-style: none; padding: 0; margin: 22px 0; display: grid; gap: 10px; }
.contact-copy li { color: #e4e4e8; font-size: 12px; display: flex; gap: 10px; align-items: center; }
.contact-copy li::before { content: '✓'; width: 21px; height: 21px; flex: none; display: grid; place-items: center; border-radius: 50%; background: var(--pink-soft); color: var(--pink); font-size: 9px; font-weight: 900; }
.contact-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 26px; }
.primary-action, .secondary-action { min-height: 47px; padding: 0 17px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 10px; font-weight: 850; transition: .25s ease; }
.primary-action { background: var(--pink); }
.secondary-action { border: 1px solid var(--border); background: rgba(255,255,255,.035); }
.primary-action:hover, .secondary-action:hover { transform: translateY(-2px); }
.contact-info-card { display: flex; flex-direction: column; justify-content: center; }
.contact-info-card > div { padding: 19px 0; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.contact-info-card > div:last-child { border-bottom: 0; }
.contact-info-card small { color: var(--muted-2); font-size: 8px; text-transform: uppercase; letter-spacing: .13em; }
.contact-info-card strong { font-size: 12px; line-height: 1.55; }

.drawer-overlay { position: fixed; inset: 0; z-index: 90; border: 0; background: rgba(0,0,0,.64); backdrop-filter: blur(6px); opacity: 0; pointer-events: none; transition: opacity .3s ease; }
.drawer-overlay.show { opacity: 1; pointer-events: auto; }
.cart-drawer { position: fixed; z-index: 100; inset: 0 0 0 auto; width: min(430px, 100%); display: grid; grid-template-rows: auto 1fr auto; background: #0d0d10; border-left: 1px solid var(--border); box-shadow: -30px 0 80px rgba(0,0,0,.45); transform: translateX(105%); transition: transform .38s cubic-bezier(.2,.8,.2,1); }
.cart-drawer.open { transform: translateX(0); }
.drawer-header { padding: 21px 22px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
.drawer-header small { color: var(--pink); font-size: 8px; letter-spacing: .15em; font-weight: 850; }
.drawer-header h2 { margin: 3px 0 0; font-size: 26px; letter-spacing: -.04em; }
.icon-button { width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--border); border-radius: 12px; background: rgba(255,255,255,.03); cursor: pointer; }
.drawer-content { overflow-y: auto; padding: 8px 22px 20px; }
.cart-empty { min-height: 330px; height: 100%; display: grid; place-items: center; align-content: center; text-align: center; }
.cart-empty > span { width: 55px; height: 55px; display: grid; place-items: center; border-radius: 17px; background: var(--pink-soft); color: var(--pink); font-weight: 900; }
.cart-empty h3 { margin: 15px 0 5px; font-size: 14px; }
.cart-empty p { margin: 0; color: var(--muted); font-size: 11px; }
.cart-item { padding: 18px 0; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 1fr auto; gap: 10px; }
.cart-item > div:first-child { display: flex; flex-direction: column; gap: 4px; }
.cart-item strong { font-size: 12px; }
.cart-item small { color: var(--muted-2); font-size: 9px; }
.cart-item-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; }
.quantity { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.quantity button { width: 29px; height: 29px; border: 0; background: transparent; cursor: pointer; }
.quantity span { min-width: 24px; text-align: center; font-size: 10px; }
.remove { border: 0; background: none; color: #74747d; font-size: 8px; cursor: pointer; padding: 0; }
.drawer-footer { padding: 19px 22px 24px; border-top: 1px solid var(--border); }
.drawer-footer > div { display: flex; justify-content: space-between; align-items: center; margin-bottom: 13px; }
.drawer-footer > div span { color: var(--muted); font-size: 10px; }
.drawer-footer > div strong { font-size: 19px; }
.checkout { width: 100%; min-height: 48px; border: 0; border-radius: 13px; background: var(--pink); display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 10px; font-weight: 900; cursor: pointer; }
.checkout:disabled { opacity: .4; cursor: not-allowed; }
.drawer-footer > small { display: block; color: #6f6f77; font-size: 8px; line-height: 1.5; text-align: center; margin-top: 9px; }

.site-footer { width: min(1240px, calc(100% - 36px)); margin: 0 auto; border-top: 1px solid var(--border); position: relative; z-index: 5; }
.footer-main { padding: 42px 0 32px; display: grid; grid-template-columns: 1fr 1.55fr; gap: 55px; }
.footer-brand { display: flex; align-items: center; gap: 14px; align-self: start; }
.footer-brand img { width: 54px; height: 54px; object-fit: cover; border-radius: 50%; }
.footer-brand div { display: flex; flex-direction: column; gap: 4px; }
.footer-brand strong { font-size: 13px; }
.footer-brand span { color: var(--muted-2); font-size: 9px; }
.footer-links { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.footer-links > div { display: flex; flex-direction: column; gap: 9px; }
.footer-links small { color: var(--pink); font-size: 8px; letter-spacing: .13em; text-transform: uppercase; font-weight: 850; margin-bottom: 3px; }
.footer-links a, .footer-links span { color: var(--muted); font-size: 9px; display: flex; align-items: center; gap: 6px; line-height: 1.5; }
.footer-links a:hover { color: white; }
.footer-links svg { width: 13px; height: 13px; }
.footer-bottom { min-height: 58px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; gap: 16px; color: #66666f; font-size: 8px; }
.footer-bottom a:hover { color: var(--pink); }

.verified-badge { position: fixed; z-index: 65; left: 18px; bottom: 18px; min-height: 44px; padding: 7px 11px 7px 7px; border: 1px solid rgba(255,255,255,.12); border-radius: 14px; background: rgba(12,12,15,.88); backdrop-filter: blur(18px); box-shadow: 0 12px 35px rgba(0,0,0,.32); display: flex; align-items: center; gap: 8px; animation: badgeIn .6s .7s ease both; }
.verified-badge > span { width: 30px; height: 30px; border-radius: 50%; background: var(--pink); display: grid; place-items: center; }
.verified-badge > span svg { width: 16px; height: 16px; stroke-width: 2.3; }
.verified-badge > div { display: flex; flex-direction: column; gap: 1px; }
.verified-badge strong { font-size: 9px; }
.verified-badge small { color: var(--muted-2); font-size: 7px; }

@media (max-width: 960px) {
  .hero-section { grid-template-columns: 1fr 1fr; gap: 20px; }
  .hero-copy h1 { font-size: 58px; }
  .hero-visual { min-height: 390px; }
  .product-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
  .contact-hero { grid-template-columns: 1fr; }
  .footer-main { grid-template-columns: 1fr; gap: 30px; }
}

@media (max-width: 680px) {
  body { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
  .site-header { width: calc(100% - 28px); min-height: 70px; grid-template-columns: 1fr auto; gap: 10px; }
  .brand img { width: 41px; height: 41px; }
  .brand strong { font-size: 12px; }
  .brand small { font-size: 7px; }
  .desktop-nav { display: none; }
  .cart-button { min-width: 43px; padding: 0 10px; justify-content: center; }
  .cart-label { display: none; }
  .cart-button b { position: absolute; margin: -31px 0 0 31px; min-width: 17px; height: 17px; font-size: 7px; }
  .mobile-nav { position: fixed; z-index: 70; left: 12px; right: 12px; bottom: max(10px, env(safe-area-inset-bottom)); height: 60px; border: 1px solid rgba(255,255,255,.11); border-radius: 20px; background: rgba(13,13,16,.92); backdrop-filter: blur(20px); box-shadow: 0 18px 50px rgba(0,0,0,.4); display: grid; grid-template-columns: repeat(3, 1fr); padding: 5px; }
  .mobile-nav-item { border-radius: 15px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: #85858e; font-size: 7px; font-weight: 750; }
  .mobile-nav-item svg { width: 18px; height: 18px; }
  .mobile-nav-item.active { color: white; background: rgba(255,79,154,.12); }
  .mobile-nav-item.active svg { color: var(--pink); }
  .page { width: calc(100% - 28px); }
  .hero-section { min-height: auto; grid-template-columns: 1fr; padding: 38px 0 20px; gap: 15px; }
  .hero-copy { text-align: center; }
  .hero-copy .eyebrow { justify-content: center; }
  .hero-copy .eyebrow::before { display: none; }
  .hero-copy h1 { font-size: clamp(44px, 14vw, 62px); margin: 14px auto 17px; max-width: 560px; }
  .hero-copy p { font-size: 12px; line-height: 1.65; margin-inline: auto; }
  .hero-cta { min-height: 45px; }
  .hero-visual { min-height: 310px; }
  .hero-visual::before { width: 75%; }

  function escapeHTML(value='') {
    return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function money(value) {
    return Number(value || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
  }
  function loadSession() {
    try { return JSON.parse(localStorage.getItem('jg_admin_session') || 'null'); } catch { return null; }
  }
  function saveSession(session) {
    state.session = session;
    if (session) localStorage.setItem('jg_admin_session', JSON.stringify(session));
    else localStorage.removeItem('jg_admin_session');
  }
  function saveCart() { localStorage.setItem('jg_cart', JSON.stringify(state.cart)); }
  function currentRoute() {
    const raw = location.hash.replace(/^#/, '') || '/';
    return raw.startsWith('/') ? raw : '/' + raw;
  }
  function go(path) {
    if (location.hash === '#' + path) { render(); return; }
    location.hash = path;
  }
  function cartCount() { return state.cart.reduce((s,i)=>s+i.quantity,0); }
  function cartTotal() { return state.cart.reduce((s,i)=>s + Number(i.price)*i.quantity,0); }

  function headers(auth=false, extra={}) {
    const token = auth && state.session?.access_token ? state.session.access_token : SUPABASE_KEY;
    return { apikey: SUPABASE_KEY, Authorization: `Bearer ${token}`, ...extra };
  }

  async function request(url, options={}, auth=false) {
    const res = await fetch(url, { ...options, headers: headers(auth, options.headers || {}) });
    if (res.status === 401 && auth) {
      saveSession(null);
      throw new Error('Sessão expirada. Entre novamente.');
    }
    if (!res.ok) {
      let msg = `Erro ${res.status}`;
      try {
        const data = await res.json();
        msg = data.message || data.error_description || data.error || data.hint || msg;
      } catch {}
      throw new Error(msg);
    }
    if (res.status === 204) return null;
    const type = res.headers.get('content-type') || '';
    return type.includes('application/json') ? res.json() : res.text();
  }

  async function rest(path, {method='GET', body, auth=false, prefer}={}) {
    const opts = { method, headers:{} };
    if (body !== undefined) {
      opts.headers['Content-Type'] = 'application/json';
      opts.body = JSON.stringify(body);
    }
    if (prefer) opts.headers['Prefer'] = prefer;
    return request(`${SUPABASE_URL}/rest/v1/${path}`, opts, auth);
  }

  async function login(email, password) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST',
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`, 'Content-Type':'application/json' },
      body:JSON.stringify({email,password})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error_description || data.msg || data.message || 'E-mail ou senha incorretos.');
    saveSession(data);
    return data;
  }

  function addToCart(id) {
    const p = state.products.find(x => String(x.id) === String(id)) || FALLBACK_PRODUCTS.find(x => String(x.id)===String(id));
    if (!p || Number(p.stock)<=0) return;
    const found = state.cart.find(x => String(x.id) === String(id));
    if (found) {
      const max = Number(p.stock) || Infinity;
      if (found.quantity < max) found.quantity++;
    } else state.cart.push({id:p.id,name:p.name,price:Number(p.price),quantity:1});
    saveCart(); state.cartOpen = true; render();
  }
  function cartAdd(id) {
    const p = state.products.find(x => String(x.id)===String(id));
    const item = state.cart.find(x=>String(x.id)===String(id));
    if (item && (!p || item.quantity < Number(p.stock))) item.quantity++;
    saveCart(); render();
  }
  function cartDec(id) {
    const item = state.cart.find(x=>String(x.id)===String(id));
    if (!item) return;
    item.quantity--;
    if (item.quantity<=0) state.cart = state.cart.filter(x=>String(x.id)!==String(id));
    saveCart(); render();
  }
  function cartRemove(id) { state.cart = state.cart.filter(x=>String(x.id)!==String(id)); saveCart(); render(); }
  function checkout() {
    if (!state.cart.length) return;
    const lines = state.cart.map(i=>`• ${i.quantity}x ${i.name} — ${money(i.price*i.quantity)}`).join('\n');
    const msg = `Olá, Jessica Gourmet! Gostaria de fazer este pedido:\n\n${lines}\n\nTotal: ${money(cartTotal())}\n\nPode me confirmar a disponibilidade?`;
    window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank', 'noopener');
  }

  async function uploadProductImage(file) {
    const ext=(file.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    const name=`${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext||'jpg'}`;
    await request(`${SUPABASE_URL}/storage/v1/object/products/${encodeURIComponent(name)}`, {
      method:'POST',
      headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},
      body:file
    }, true);
    return `${SUPABASE_URL}/storage/v1/object/public/products/${encodeURIComponent(name)}`;
  }

  async function saveProduct(event, editing) {
    event.preventDefault();
    const form=event.currentTarget;
    const btn=document.getElementById('saveProduct');
    const msg=document.getElementById('productFormMessage');
    btn.disabled=true; btn.textContent='Salvando...'; msg.innerHTML='';
    try {
      const fd=new FormData(form);
      let image_url=editing?.image_url || null;
      const file=fd.get('photo');
      if (file && file.size) image_url=await uploadProductImage(file);
      const payload={
        name:String(fd.get('name')).trim(),
        price:Number(fd.get('price')),
        stock:Math.max(0,Number(fd.get('stock'))),
        sort_order:Number(fd.get('sort_order')||0),
        active:fd.get('active')==='on',
        image_url
      };
      if(editing) await rest(`products?id=eq.${editing.id}`, {method:'PATCH',body:payload,auth:true,prefer:'return=representation'});
      else await rest('products', {method:'POST',body:payload,auth:true,prefer:'return=representation'});
      document.getElementById('adminModalRoot').innerHTML='';
      state.productsLoaded=false;
      await loadAdminProducts();
    } catch(e) {
      msg.innerHTML=`<div class="admin-message">${escapeHTML(e.message)}</div>`;
      btn.disabled=false; btn.textContent=editing?'Salvar alterações':'Criar produto';
    }
  }

  function bindAdminProductActions() {
    document.querySelectorAll('[data-edit-product]').forEach(b=>b.addEventListener('click',()=>productModal(state.adminProducts.find(p=>p.id===b.dataset.editProduct))));
    document.querySelectorAll('[data-delete-product]').forEach(b=>b.addEventListener('click',async()=>{
      const p=state.adminProducts.find(x=>x.id===b.dataset.deleteProduct);
      if(!p || !confirm(`Excluir ${p.name}?`)) return;
      try { await rest(`products?id=eq.${p.id}`, {method:'DELETE',auth:true}); state.productsLoaded=false; await loadAdminProducts(); }
      catch(e){ alert(e.message); }
    }));
  }

      <form class="admin-modal compact" id="orderForm">
        <div class="admin-modal-head"><div><small>NOVO PEDIDO</small><h2>Criar rastreio</h2></div><button type="button" id="closeAdminModalX">×</button></div>
        <div class="generated-code"><small>CÓDIGO GERADO</small><strong>${code}</strong></div>
        <div class="admin-form-grid one-column">
          <label>Nome do cliente<input name="customer_name" placeholder="Opcional"></label>
          <label>WhatsApp do cliente<input name="customer_phone" placeholder="Opcional"></label>
          <label>Resumo do pedido<textarea name="summary" rows="3" placeholder="Ex.: 2x Morango com Nutella, 1x Paçoca"></textarea></label>
          <label>Status inicial<select name="status">${Object.entries(STATUS).map(([v,s])=>`<option value="${v}">${s.short}</option>`).join('')}</select></label>
        </div>
        <div id="orderFormMessage"></div>
        <div class="admin-modal-actions"><button type="button" class="admin-secondary" id="cancelOrder">Cancelar</button><button class="admin-primary" id="saveOrder">Criar pedido</button></div>
      </form></div>`;
    ['closeAdminModal','closeAdminModalX','cancelOrder'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>root.innerHTML=''));
    document.getElementById('orderForm').addEventListener('submit', e=>saveOrder(e,code));
  }

  async function saveOrder(event, code) {
    event.preventDefault();
    const fd=new FormData(event.currentTarget), btn=document.getElementById('saveOrder'), msg=document.getElementById('orderFormMessage');
    btn.disabled=true; btn.textContent='Criando...';
    const payload={
      tracking_code:code,
      customer_name:String(fd.get('customer_name')||'').trim()||null,
      customer_phone:String(fd.get('customer_phone')||'').trim()||null,
      summary:String(fd.get('summary')||'').trim()||null,
      status:String(fd.get('status')||'confirmed')
    };
    try {
      await rest('orders',{method:'POST',body:payload,auth:true,prefer:'return=representation'});
      try { await navigator.clipboard.writeText(code); } catch {}
      document.getElementById('adminModalRoot').innerHTML='';
      await loadAdminOrders();
      alert(`Pedido criado! Código: ${code}`);
    } catch(e) { msg.innerHTML=`<div class="admin-message">${escapeHTML(e.message)}</div>`; btn.disabled=false; btn.textContent='Criar pedido'; }
  }

  async function updateOrderStatus(id,status) {
    try { await rest(`orders?id=eq.${id}`,{method:'PATCH',body:{status},auth:true,prefer:'return=representation'}); await loadAdminOrders(); }
    catch(e){ alert(e.message); }
  }
  function bindAdminOrderActions() {
    document.querySelectorAll('[data-copy-code]').forEach(b=>b.addEventListener('click',async()=>{ try{await navigator.clipboard.writeText(b.dataset.copyCode)}catch{} }));
    document.querySelectorAll('[data-advance-order]').forEach(b=>b.addEventListener('click',()=>updateOrderStatus(b.dataset.advanceOrder,nextStatus(b.dataset.status))));
    document.querySelectorAll('[data-order-status]').forEach(s=>s.addEventListener('change',()=>updateOrderStatus(s.dataset.orderStatus,s.value)));
    document.querySelectorAll('[data-delete-order]').forEach(b=>b.addEventListener('click',async()=>{
      const o=state.adminOrders.find(x=>x.id===b.dataset.deleteOrder);
      if(!o || !confirm(`Excluir o pedido ${o.tracking_code}?`)) return;
      try{ await rest(`orders?id=eq.${o.id}`,{method:'DELETE',auth:true}); await loadAdminOrders(); }catch(e){alert(e.message)}
    }));
  }

  function bindCommon() {
    document.getElementById('openCart')?.addEventListener('click',()=>{state.cartOpen=true;render();});
    document.getElementById('closeCart')?.addEventListener('click',()=>{state.cartOpen=false;render();});
    document.getElementById('cartOverlay')?.addEventListener('click',()=>{state.cartOpen=false;render();});
    document.getElementById('checkout')?.addEventListener('click',checkout);
    document.getElementById('seeFlavors')?.addEventListener('click',()=>document.getElementById('sabores')?.scrollIntoView({behavior:'smooth',block:'start'}));
    document.querySelectorAll('[data-add-product]').forEach(b=>b.addEventListener('click',()=>addToCart(b.dataset.addProduct)));
    document.querySelectorAll('[data-cart-add]').forEach(b=>b.addEventListener('click',()=>cartAdd(b.dataset.cartAdd)));
    document.querySelectorAll('[data-cart-dec]').forEach(b=>b.addEventListener('click',()=>cartDec(b.dataset.cartDec)));
    document.querySelectorAll('[data-cart-remove]').forEach(b=>b.addEventListener('click',()=>cartRemove(b.dataset.cartRemove)));
  }

  function bindTracking() {
    document.getElementById('trackingForm')?.addEventListener('submit', async e => {
      e.preventDefault();
      const input=document.getElementById('trackingCode'), out=document.getElementById('trackingOutput'), button=document.getElementById('trackingSubmit');
      const code=input.value.trim().toUpperCase();
      if(!code){out.innerHTML='<div class="tracking-message">Digite o código do seu pedido.</div>';return;}
      button.disabled=true;button.textContent='Consultando...';out.innerHTML='';
      try {
        const data=await rest('rpc/track_order',{method:'POST',body:{code_input:code}});
        const item=Array.isArray(data)?data[0]:data;
        out.innerHTML=item?trackingResult(item):'<div class="tracking-message">Pedido não encontrado. Confira o código e tente novamente.</div>';
      } catch(e){out.innerHTML='<div class="tracking-message">Não foi possível consultar agora. Tente novamente em instantes.</div>';}
      button.disabled=false;button.textContent='Consultar';
    });
  }

  function bindAdmin() {
    if (!state.session?.access_token) {
      document.getElementById('adminLoginForm')?.addEventListener('submit', async e=>{
        e.preventDefault();
        const msg=document.getElementById('adminLoginMessage'), btn=document.getElementById('adminLoginButton');
        btn.disabled=true;btn.textContent='Entrando...';msg.innerHTML='';
        try {
          await login(document.getElementById('adminEmail').value.trim(),document.getElementById('adminPassword').value);
          render();
        } catch(err) {
          msg.innerHTML=`<div class="admin-message">${escapeHTML(err.message || 'E-mail ou senha incorretos.')}</div>`;
          btn.disabled=false;btn.textContent='Entrar no painel';
        }
      });
      return;
    }
    const logout=()=>{saveSession(null);state.adminTab='home';render();};
    document.getElementById('adminLogout')?.addEventListener('click',logout);
    document.getElementById('adminLogoutMobile')?.addEventListener('click',logout);
    document.querySelectorAll('[data-admin-tab]').forEach(b=>b.addEventListener('click',()=>{state.adminTab=b.dataset.adminTab;render();}));
    if(state.adminTab==='home') loadAdminHome();
    if(state.adminTab==='products') { document.getElementById('newProduct')?.addEventListener('click',()=>productModal()); loadAdminProducts(); }
    if(state.adminTab==='orders') { document.getElementById('newOrder')?.addEventListener('click',orderModal); loadAdminOrders(); }
  }

  function render() {
    state.route=currentRoute();
    if(state.route.startsWith('/admin')) {
      app.innerHTML=adminPage();
      bindAdmin();
      return;
    }
    if(!['/','/rastreio','/contato'].includes(state.route)) state.route='/';
    let page=state.route==='/rastreio'?trackingPage():state.route==='/contato'?contactPage():homePage();
    app.innerHTML=layout(page);
    bindCommon();
    if(state.route==='/') loadPublicProducts();
    if(state.route==='/rastreio') bindTracking();
  }

  window.addEventListener('hashchange',()=>{state.cartOpen=false;window.scrollTo(0,0);render();});
  render();
})();
</script>
</body>
</html>
